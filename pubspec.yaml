name: ecoscan_rewards
description: "EcoScan Rewards - App de reciclaje con reconocimiento de materiales por ML Kit"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  google_fonts: ^8.0.2

  # Estado
  provider: ^6.1.5+1

  # Base de datos
  sqflite: ^2.4.2
  path: ^1.9.1

  # Cámara y ML kit
  camera: ^0.12.0+1
  google_mlkit_image_labeling: ^0.14.2
  google_mlkit_object_detection: ^0.15.1
  google_mlkit_commons: ^0.11.1

  # Utilidades
  crypto: ^3.0.7
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ml/
